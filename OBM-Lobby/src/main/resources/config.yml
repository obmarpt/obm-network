lobby:
  # force-always: true → /lobby ignora combat, cooldown e estado bugado (recomendado produção)
  command:
    force-always: true
    debug: false
  world: Lobby
  spawn:
    x: 0.5
    y: 164.0
    z: 0.5
    yaw: -90
    pitch: 0

# Hotbar fixa no lobby (slots 0, 1, 2, 8)
lobby-items:
  navigator:
    slot: 0
    material: COMPASS
    name: "&e&lNavegador"
    lore:
      - "&7Escolhe um modo de jogo"
      - "&eClique para abrir"
  battlepass:
    slot: 1
    material: NETHER_STAR
    name: "&6&lBattle Pass"
    lore:
      - "&7Recompensas e quests"
      - "&eClique para ver"
  profile:
    slot: 2
    material: PLAYER_HEAD
    name: "&b&lPerfil"
    lore:
      - "&7As tuas estatísticas"
      - "&eClique para abrir"
  back:
    slot: 8
    material: RED_BED
    name: "&c&lVoltar"
    lore:
      - "&7Regressar ao spawn"
      - "&eClique para voltar"

# NPCs Citizens — nomes sugeridos (criar no mapa com Citizens):
#   SMP:       &6&l⚔ SMP
#   Hardcore:  &c&l☠ Hardcore
#   TierSpace: &b&l🏆 TierSpace
# Clique → NpcModeRouter (OBM-Core). Hologramas → plugins/OBM-Core/holograms.yml

# Navegador de modos (27 slots) — linha central: SMP · Hardcore · TierSpace
main-menu:
  title: "&8✦ &7Escolhe um modo"
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  layout:
    smp: 11
    hardcore: 13
    tierspace: 15
  feedback:
    use-title: true
    title-fade-in: 5
    title-stay: 25
    title-fade-out: 10
  modes:
    smp:
      material: GRASS_BLOCK
      name: "&6&l⚔ SMP"
      lore:
        - "&7Survival · Economia · PvP"
      entering: "&aA entrar em SMP..."
    tierspace:
      material: DIAMOND_SWORD
      name: "&b&l🏆 TierSpace"
      lore:
        - "&7Ranked 1v1 · Elo · Seasons"
      entering: "&bA entrar em TierSpace..."
    hardcore:
      locked:
        material: BARRIER
        name: "&c&l🔒 Hardcore"
        lore:
          - "&7Desbloqueado em:"
          - "&e{coins} Money"
          - "&eNível {level}"
      unlocked:
        material: NETHERITE_SWORD
        name: "&c&l☠ Hardcore"
        lore:
          - "&7Vidas limitadas · alto risco"
      entering: "&cA entrar em Hardcore..."

# Hologramas: plugins/OBM-Core/holograms.yml (HologramService)
# Requisitos Hardcore (coins/level): plugins/OBM-Core/config.yml → hardcore.unlock
