# This is the Message file for all Custom Jumppads messages.
#
# All messages are fully customizable and support color codes, formatting and ASCII symbols.
# Set the Prefix and use %prefix% to add the corresponding prefix to a message.
# Prepend any message with <ActionBar> to send it as an ActionBar message.
# Leave a message blank ('') to disable it.
#
# You can also create messages with Hover and Click events. Syntax options: (Space between comma and quote is NOT allowed)
#  - ["Message","/Command"]
#  - ["Message","Hover"]
#  - ["Message","/Command","Hover"]
#  - ["Message","/Command","Suggest"]
#  - ["Message","/Command","Hover","Suggest"]
# You can add as many events to a message as you want. Example:
# '%prefix% &cInvalid arguments! ["&c&n&oHelp","/jumppads help","&aClick to get help!"]'
# The "Suggest" tag is used if the click event should suggest the command. Default is Run.

Prefix: '&8[&6Jump Pads&8]'
Messages:
  PlayerOnly: '%prefix% &cEste comando só pode ser usado in-game!'
  InvalidPermission: '%prefix% &cNão tens permissão para fazer isto!'
  InvalidArguments: '%prefix% &cArgumentos inválidos! ["&c&n&oAjuda","/jumppads help","&aClica
    para ver ajuda!"]'
  InvalidTarget: '%prefix% &cJump pads só podem ser criados em placas de pressão ou
    slime blocks!'
  InvalidPower: '%prefix% &cNão podes definir <power> acima de %maxPower%!'
  ConfigurationsReloaded: '%prefix% &aConfigurações recarregadas com sucesso!'
  Created: '%prefix% &aJump pad criado!'
  Deleted: '%prefix% &aJump pad removido!'
  NotAJumppad: '%prefix% &cO bloco selecionado não é um jump pad!'
  InvalidAttribute: '%prefix% &cAtributo inválido!'
  AddedAttribute: '%prefix% &aValor do atributo definido.'
  RemovedAttribute: '%prefix% &aAtributo removido. A usar default se existir.'
  NotSupported: '%prefix% &cNão suportado nesta versão.'
  UnsafeTeleport: '%prefix% &cNão há destino seguro no jump pad!'
  InCombat: '%prefix% &cNão podes usar jump pads em combate!'
