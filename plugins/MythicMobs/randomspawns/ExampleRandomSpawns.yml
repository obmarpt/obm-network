# OMD Network — random spawns de exemplo DESACTIVADOS no SMP.
# Skeleton King / Skeletal Knight não devem substituir mobs no mundo "world".
# Para dungeons: cria ficheiro separado com Worlds: dungeon_world apenas.

RandomSkeletonKing:
  Type: SkeletonKing
  Worlds: __disabled_no_smp__
  Chance: 0
  Priority: 1
  Action: REPLACE
  Conditions:
  - outside true

RandomSkeletalKnight:
  Type: SkeletalKnight
  Worlds: __disabled_no_smp__
  Chance: 0
  Priority: 1
  Action: REPLACE
