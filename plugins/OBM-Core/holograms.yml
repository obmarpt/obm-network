# =============================================================================
# MineSpace — hologramas OBM-Core (HologramService + DecentHolograms DHAPI)
# =============================================================================
# • Única fonte: este ficheiro (não uses plugins/DecentHolograms/holograms/*.yml)
# • IDs explícitos — evita duplicar com /dh create manual
# • Static + %obm_*% / %server_online% → PlaceholderAPI + interval DH (~40 ticks)
# • Leaderboard → DataStore (actualização: settings.dynamic-update-ticks)
# • Tops rede → config.yml remote-leaderboard.holograms (API 60s)
# =============================================================================

settings:
  id-prefix: obm
  dynamic-update-ticks: 200
  static-refresh-ticks: 40

holograms:

  # ---------------------------------------------------------------------------
  # LOBBY — base (spawn, stats, ajuda)
  # ---------------------------------------------------------------------------
  lobby:

    welcome:
      id: obm_lobby_welcome
      type: static
      world: Lobby
      x: 0.5
      y: 168.0
      z: -6.5
      lines:
        - "&b&l✦ MineSpace ✦"
        - "&8──────────────"
        - "&7Olá, &f%player_name%&7!"
        - "&7Online: &a%server_online%&7/&a%server_max_players%"
        - "&6⚔ Rush &8· &c💀 Hardcore &8· &b🏆 TierSpace"
        - "&8──────────────"
        - "&e/menu &7· &e/lobby &7· NPCs abaixo"

    help:
      id: obm_lobby_help
      type: static
      world: Lobby
      x: 3.5
      y: 167.0
      z: -4.5
      lines:
        - "&e&l❓ COMO JOGAR"
        - "&8──────────────"
        - "&7Clica num &fNPC &7ou &e/menu"
        - "&7Rush: farm, loja, PvP"
        - "&7Hardcore: vidas limitadas"
        - "&7TierSpace: ranked 1v1"
        - "&8──────────────"
        - "&7Loja global: &e/shopglobal"

    player_stats:
