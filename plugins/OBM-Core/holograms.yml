        - "&8──────────────"
        - "&7💰 Money: &e%obm_money%"
        - "&7💎 Emeralds: &a%obm_emeralds%"
        - "&7📈 Level: &f%obm_level% &8| &e%obm_rank%"
        - "&7🏆 Tier: &b%obm_tier_rating_sword% &7(&f%obm_tier_rank_sword%&7)"
        - "&7W/L: &a%obm_tier_wins_sword%&8/&c%obm_tier_losses_sword%"

    rewards:
