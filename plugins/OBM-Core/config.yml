# =========================
# MineSpace - Core Config
# =========================

smp-worlds:
  - world
  - world_nether
  - world_the_end

uhc-worlds:
  - UHC
  - UHC_nether
  - UHC_the_end

combatlog:
  timeout: 15000
  blocked-commands:
    - home
    - warp
    - teleport

lobby:
  world: Lobby
  day-time: 1000
  spawn:
    x: 0.5
    y: 164.0
    z: 0.5
    yaw: -90
    pitch: 0

player-state-reset:
  enabled: true
  join-delay-ticks: 3
  join-followup-ticks: 10
  respawn-delay-ticks: 2
  hard-reset-lobby: true
  prefer-lobby-when-unstable: true
  teleport-if-airborne: true
  double-resync: true
  spartan-grace-enabled: true
  spartan-grace-ticks: 40

join-stabilize:
  enabled: true
  delay-ticks: 3
  invalid-teleport-lobby: true
  teleport-if-airborne: true
  spartan-grace-enabled: true
  spartan-grace-ticks: 40

admin:
  default-smp-balance: 100

# Desbloqueio do Hardcore (level + coins do Rush/SMP — %obm_level% / %obm_coins%)
hardcore:
  unlock:
    enabled: true
    required-level: 10
    required-coins: 200000
