name: OBM-SMP
main: com.obm.network.smp.SMPPlugin
version: 1.0
api-version: 1.20
author: Obmar
description: SMP do MineSpace com economia e mercado de players

depend:
  - OBM-Core
softdepend:
  - Vault
  - LuckPerms

permissions:
  obm.smp.enter:
    description: Entrar no mundo RushSMP (/smp)
    default: false
  obm.smp.shop:
    description: Abrir loja SMP e categorias base
    default: false
  obm.smp.sell:
    description: Vender itens no SMP
    default: false
  obm.smp.auction:
    description: Usar leilão /ah
    default: false
  obm.smp.rank:
    description: Ver e comprar ranks SMP
    default: false
  obm.smp.money:
    description: Ver saldo SMP (/money)
    default: false
  obm.smp.money.pay:
    description: Pagar outros jogadores (/money pay)
    default: false
  obm.smp.market:
    description: Mercado de jogadores (/market)
    default: false
  obm.smp.top:
    description: Ver leaderboards RushSMP (/top)
    default: false
  obm.stats:
    description: Consultar stats de outros jogadores (/stats)
    default: op
  obm.smp.vip:
    description: Perks VIP (+coins, itens exclusivos na loja)
    default: false
  obm.smp.admin:
    description: Bypass de restrições SMP e mensagens debug
    default: op

commands:
  smp:
    description: Entrar no SMP
    usage: /smp

  shop:
    description: Abrir a loja do SMP
    usage: /shop

  sell:
    description: Vender itens no SMP
    usage: /sell

  ah:
    description: Abrir o leilão do SMP
    usage: /ah
    aliases: [auction]

  auction:
    description: Abrir o leilão do SMP
    usage: /auction

  money:
    description: Ver saldo e pagar outros jogadores
    usage: /money [pay <player> <amount>]

  market:
    description: Mercado de SMP com ofertas de players
    usage: /market <list|sell|buy|remove>

  rank:
    description: Ver rank, comprar rank ou listar ranks
    usage: /rank [buy|list]

  top:
    description: Ver leaderboards
    usage: /top

  stats:
    description: Consultar estatísticas de um jogador (staff)
    usage: /stats <modo> <stat> <player>
    permission: obm.stats
