starting-balance: 100

# Estabilização após morte (anti falsos positivos Spartan / movimento)
respawn:
  use-safe-spawn: true
  stabilize-delay-ticks: 2
  teleport-if-airborne: true
  spartan-grace-enabled: true
  spartan-grace-ticks: 60

spawn:
  protection-radius: 100
  center:
    use-world-spawn: true

economy:
  kill-reward: 150
  death-penalty: 50
  death-penalty-enabled: true
  pay:
    cooldown-seconds: 30
    daily-send-limit: 50000
    log-amount-threshold: 10000

market:
  max-listings-per-player: 8
  min-price: 1
  max-price: 1000000
  listing-cooldown-seconds: 45

exploits:
  kill-cooldown-minutes: 30

rewards:
  playtime:
    enabled: true
    interval-minutes: 30
    amount: 500

  # Daily movido para OBM-Core (/daily + daily-rewards.smp-coins)
  daily:
    enabled: false

  # Marcos únicos por tempo total no Rush (playtime_smp)
  milestones:
    enabled: true
    tiers:
      - minutes: 30
        coins: 500
      - minutes: 60
        coins: 1200

ranks:
  default: bronze
  levels:
    bronze:
      display-name: "Bronze"
      cost: 0
      sell-boost: 0.0
      kill-boost: 0.0
      shop-discount: 0.0
    silver:
      display-name: "Silver"
      cost: 2500
      sell-boost: 0.05
      kill-boost: 0.05
      shop-discount: 0.03
    gold:
      display-name: "Gold"
      cost: 10000
      sell-boost: 0.10
      kill-boost: 0.10
      shop-discount: 0.05
    diamond:
      display-name: "Diamond"
      cost: 35000
      sell-boost: 0.15
      kill-boost: 0.15
      shop-discount: 0.08
    emerald:
      display-name: "Emerald"
      cost: 100000
      sell-boost: 0.20
      kill-boost: 0.20
      shop-discount: 0.10

levels:
  xp-per-kill: 25
  xp-per-sell-coin: 0.4
  xp-per-playtime-interval: 20
  base-xp-required: 100
  xp-scale: 1.15
  max-level: 100
  reward-per-level-coins: 25
  bonus-per-level:
    sell: 0.002
    kill: 0.001

