name: OBM-TierSpace
main: com.obm.network.tierspace.TierSpacePlugin
version: 1.0
api-version: '1.21'
author: Obmar
description: Modo competitivo TierSpace com ranking Elo por tipo de PvP

depend:
  - OBM-Core

softdepend:
  - GrimAC
  - Spartan
  - LiteBans

permissions:
  obm.tierspace.use:
    description: Menu e estatísticas TierSpace (/tierspace)
    default: false
  obm.tierspace.queue:
    description: Entrar na fila competitiva (/queue)
    default: false
  tierspace.admin.season:
    description: Avançar ou corrigir temporada TierSpace manualmente
    default: op

commands:
  tierspace:
    description: Menu e info do TierSpace
    usage: /tierspace [menu|stats|season]
    aliases: [ts, tier]
    permission: obm.tierspace.use

  queue:
    description: Entrar ou sair da fila competitiva
    usage: /queue <mode|leave|status>
    permission: obm.tierspace.queue

  leave:
    description: Sair da fila TierSpace
    usage: /leave
    permission: obm.tierspace.queue

  party:
    description: Gerir party TierSpace
    usage: /party <create|invite|accept|leave|kick>
    permission: obm.tierspace.use
