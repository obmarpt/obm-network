# OBM-TierSpace — Phase 3 Multi-Mode Competitive

world: TierSpace

rating:
  default: 600
  k-factor-new: 32
  k-factor-established: 24
  established-games: 30
  min-rating: 0
  streak-bonus-per-win: 0.10
  streak-bonus-cap: 5

placement:
  games: 10
  k-factor: 40

demotion-shield:
  enabled: true
  losses-required: 3

daily-quests:
  wins-required: 3
  wins-rating-reward: 20
  matches-required: 5
  streak-required: 3

season:
  number: 1
  start-date: "2026-01-01"
  duration-days: 45
  reset-base: 600
  reset-factor: 0.3

rank-rewards:
  Gold:
    prefix: "§6✦ "
    tag: "§6Gold Elite"
  Diamond:
    prefix: "§b◆ "
    particle: END_ROD
    tag: "§bDiamond"
  Master:
    prefix: "§d★ "
    tag: "§dMaster"
  GrandMaster:
    prefix: "§5✧ "
    particle: DRAGON_BREATH
    tag: "§5GrandMaster"

rewards:
  daily-first-win-bonus: 15

matchmaking:
  tick-interval-seconds: 1
  initial-range: 75
  range-expansion: 50
  expansion-interval-seconds: 5
  max-range: 300

match:
  countdown-seconds: 3
  post-match-delay-ticks: 60
  post-match-gui-delay-ticks: 60

