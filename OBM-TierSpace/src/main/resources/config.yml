# OBM-TierSpace — Phase 3 Multi-Mode Competitive

logging:
  debug: false

world: TierSpace

# Hub rankedSpawn — espada = Queue Duels, party = Party, bússola = menu
ranked-spawn:
  gui-refresh-ticks: 40
  queue-item:
    slot: 0
    name: "§9§l⚔ §b§lQUEUE DUELS"
  party-item:
    slot: 1
    name: "§d§l👥 PARTY"
  selector:
    enabled: true
    slot: 4
    name: "§b§lTierSpace §8| §7Menu"

rating:
  default: 600
  k-factor-new: 32
  k-factor-established: 24
  established-games: 30
  min-rating: 0
  streak-bonus-per-win: 0.10
  streak-bonus-cap: 5

placement:
  games: 10
  k-factor: 40

demotion-shield:
  enabled: true
  losses-required: 3

daily-quests:
  wins-required: 3
  wins-rating-reward: 20
  matches-required: 5
  streak-required: 3

season:
  number: 1
  # Só usado na primeira inicialização (depois persiste em data.yml → tierspace.season.*)
  start-date: "2026-06-02"
  duration-days: 45
  # Ignorado — seasons são sempre manuais (adminpanel / comando)
  auto-advance: false
  reset-base: 600
  reset-factor: 0.3

rank-rewards:
  Bronze:
    prefix: "§8▪ "
    tag: "§8Bronze"
  Silver:
    prefix: "§f◇ "
    tag: "§fSilver"
  Gold:
    prefix: "§6✦ "
    tag: "§6Gold"
  Diamond:
    prefix: "§b◆ "
    particle: END_ROD
    tag: "§bDiamond"
  Master:
    prefix: "§d★ "
    particle: DRAGON_BREATH
    tag: "§dMaster"

rewards:
  daily-first-win-bonus: 15

matchmaking:
  tick-interval-seconds: 1
  initial-range: 50
  range-expansion: 25
  expansion-interval-seconds: 4
  max-range: 250

rating-elo:
  win-min: 10
  win-max: 20
  loss-min: 8
  loss-max: 15

match:
  countdown-seconds: 3
  post-match-delay-ticks: 60
  post-match-gui-delay-ticks: 60

