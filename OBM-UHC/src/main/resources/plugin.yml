name: OBM-UHC
version: 1.0
main: com.obm.network.uhc.OBMUHCPlugin
api-version: 1.20

depend: [OBM-Core]
softdepend:
  - OBM-Lobby

permissions:
  obm.uhc.stats:
    description: Ver as próprias estatísticas UHC
    default: false

commands:
  uhcstats:
    description: Vê as tuas estatísticas do UHC.
    permission: obm.uhc.stats
  revive:
    description: Revive um jogador com 2 vidas.
    permission: uhc.revive
  revivegeral:
    description: Revive todos os jogadores eliminados de uma vez.
    permission: uhc.revive
  revivetotal:
    description: Revive o jogador com vidas, itens e teleporta-o para o spawn seguro do UHC.
    permission: uhc.revive