<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBM Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    .hidden { display: none !important; }

    /* Login */
    .login-wrap {
      max-width: 380px;
      margin: 4rem auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
    }

    .login-wrap h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }

    .input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      outline: none;
    }

    .input:focus { border-color: #3b82f6; }

    .btn {
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn-primary { background: #2563eb; color: #fff; width: 100%; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }

    .login-error { color: #f87171; font-size: 0.875rem; margin-top: 0.75rem; text-align: center; }

    /* App */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .dot.online { background: #22c55e; }
    .dot.error  { background: #ef4444; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }

    .stat-card span { display: block; font-size: 0.75rem; color: #64748b; text-transform: uppercase; margin-bottom: 0.35rem; }
    .stat-card strong { font-size: 1.5rem; color: #fbbf24; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .card-header span { font-size: 0.8rem; color: #64748b; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }

    .top-list { list-style: none; padding: 1rem 1.25rem; }
    .top-list li { padding: 0.4rem 0; border-bottom: 1px solid #334155; font-size: 0.875rem; display: flex; justify-content: space-between; }
    .top-list li:last-child { border-bottom: none; }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; min-width: 900px; }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #334155;
      vertical-align: middle;
    }

    th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #263348; }

    code { font-size: 0.75rem; color: #94a3b8; word-break: break-all; }

    .rank {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .rank-bronze   { background: #78350f; color: #fcd34d; }
    .rank-silver   { background: #374151; color: #d1d5db; }
    .rank-gold     { background: #713f12; color: #fde68a; }
    .rank-platinum { background: #1e3a5f; color: #93c5fd; }
    .rank-default  { background: #334155; color: #cbd5e1; }

    .coins    { color: #fbbf24; font-weight: 600; }
    .emeralds { color: #34d399; font-weight: 600; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.35rem; }

    .btn-give    { background: #166534; color: #bbf7d0; padding: 0.35rem 0.55rem; font-size: 0.75rem; }
    .btn-remove  { background: #713f12; color: #fde68a; padding: 0.35rem 0.55rem; font-size: 0.75rem; }
    .btn-ban     { background: #991b1b; color: #fecaca; padding: 0.35rem 0.55rem; font-size: 0.75rem; }
    .btn-kick    { background: #854d0e; color: #fef08a; padding: 0.35rem 0.55rem; font-size: 0.75rem; }
    .btn-freeze  { background: #1e40af; color: #bfdbfe; padding: 0.35rem 0.55rem; font-size: 0.75rem; }
    .btn-broadcast { background: #6d28d9; color: #ede9fe; }

    .command-panel { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .command-row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .command-row label { font-size: 0.875rem; font-weight: 600; min-width: 140px; color: #94a3b8; }
    .command-row .input { flex: 1; min-width: 200px; margin-bottom: 0; }

    .empty, .error-msg { padding: 2rem; text-align: center; color: #64748b; }
    .error-msg { color: #f87171; }

    #toastContainer {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 360px;
    }

    .toast {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .toast-success { background: #166534; color: #bbf7d0; border: 1px solid #22c55e; }
    .toast-error   { background: #991b1b; color: #fecaca; border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <div id="toastContainer"></div>

  <div id="login-view" class="login-wrap">
    <h1>OBM Admin Panel</h1>
    <input class="input" id="loginUser" type="text" placeholder="Utilizador" autocomplete="username">
    <input class="input" id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" id="loginBtn">Entrar</button>
    <p id="loginError" class="login-error"></p>
  </div>

  <div id="app-view" class="hidden">
    <header>
      <h1>OBM Admin Panel</h1>
      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
        <div class="status">
          <div class="dot" id="statusDot"></div>
          <span id="statusText">A carregar...</span>
        </div>
        <button class="btn btn-ghost" id="logoutBtn">Sair</button>
      </div>
    </header>

    <section class="stats-grid">
      <div class="stat-card"><span>Total Players</span><strong id="statTotalPlayers">—</strong></div>
      <div class="stat-card"><span>Total Coins</span><strong id="statTotalCoins">—</strong></div>
      <div class="stat-card"><span>Média Coins</span><strong id="statAvgCoins">—</strong></div>
    </section>

    <div class="grid-2">
      <div class="card">
        <div class="card-header"><strong>Top Coins</strong></div>
        <ul class="top-list" id="topCoins"><li class="empty">—</li></ul>
      </div>
      <div class="card">
        <div class="card-header"><strong>Top Emeralds</strong></div>
        <ul class="top-list" id="topEmeralds"><li class="empty">—</li></ul>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><strong>Comandos globais</strong></div>
      <div class="command-panel">
        <div class="command-row">
          <label for="manualCommand">Comando manual</label>
          <input class="input" id="manualCommand" type="text" placeholder="say &lt;mensagem&gt; (whitelist)" autocomplete="off">
          <button class="btn btn-primary" id="btnManualCommand">Executar</button>
        </div>
        <div class="command-row">
          <label for="broadcastMsg">Broadcast</label>
          <input class="input" id="broadcastMsg" type="text" placeholder="Mensagem para todos" autocomplete="off">
          <button class="btn btn-broadcast" id="btnBroadcast">📢 Broadcast</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <strong>Players</strong>
        <span id="playerCount">0 registos</span>
      </div>
      <div id="tableContainer">
        <p class="empty">A carregar players...</p>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
