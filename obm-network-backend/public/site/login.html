<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — MineSpace</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="login" data-auth-mode="login">
  <div id="app-nav"></div>
  <main class="container auth-wrap">
    <div class="auth-card card">
      <h1>Entrar</h1>
      <p class="muted">Conta web ligada ao Minecraft</p>
      <form id="authForm" style="margin-top:1.25rem;">
        <input class="input" id="email" type="email" placeholder="Email" required autocomplete="email">
        <input class="input" id="password" type="password" placeholder="Password" required autocomplete="current-password">
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <p id="authError" class="error"></p>
      </form>
      <p style="margin-top:1rem; text-align:center;" class="muted-sm">Sem conta? <a href="register.html">Registar</a></p>
    </div>
    <p class="muted-sm" style="margin-top:1rem;text-align:center;">Após entrar, liga o Minecraft em <a href="account.html">Conta</a> com <code>/link</code> in-game.</p>
  </main>
  <div id="app-footer"></div>
  <script src="/js/layout.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
