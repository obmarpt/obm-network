# MineSpace — GrimAC punishments TierSpace PvP
# Copiar para: plugins/GrimAC/punishments.yml
#
# Formato: "VL:intervalo comando"
# Fase 1 (primeiras 2 semanas): comentar kicks/bans, deixar só [alert] + [log]
# Fase 2: activar kicks
# Fase 3: activar tempban nos checks de combate

Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "80:20 [alert]"
      - "1:1 [log]"
      - "150:25 kick %player% &c[Grim] Movimento inválido"
      # - "200:50 tempban %player% 7d &c[Grim] Cheating (Simulation)"

  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "3:2 [alert]"
      - "1:1 [log]"
      - "8:4 kick %player% &c[Grim] Anti-Knockback"
      # - "15:5 tempban %player% 14d &c[Grim] Velocity"

  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"

  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "25:10 kick %player% &c[Grim] Pacotes inválidos"

  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "5:2 kick %player% &c[Grim] Reach"
      - "10:3 tempban %player% 30d &c[Grim] Reach"

  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "2:1 [alert]"
      - "1:1 [log]"
      - "6:3 kick %player% &c[Grim] Hitboxes"
      - "12:4 tempban %player% 30d &c[Grim] Hitboxes/KillAura"

  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "8:4 [alert]"
      - "1:1 [log]"
      - "15:5 kick %player% &c[Grim] Exploit"

  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "15:5 [alert]"
      - "1:1 [log]"

  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:10 [alert]"
      - "1:1 [log]"
