# MineSpace — GrimAC config otimizado para TierSpace PvP (Purpur/Paper 1.21.1)
# Copiar para: plugins/GrimAC/config.yml
# Complementar com Vulcan (other-anticheat-support: true no Vulcan)

alerts:
  print-to-console: true
  proxy:
    send: false
    receive: false

verbose:
  print-to-console: false

check-for-updates: true

client-brand:
  ignored-clients:
    - "^vanilla$"
    - "^fabric$"
    - "^quilt$"
    - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
    - "^Feather Fabric$"
    - "^labymod$"
  disconnect-blacklisted-forge-versions: true

spectators:
  hide-regardless: false
  allowed-worlds:
    - "TierSpace"

max-transaction-time: 60

# OBRIGATÓRIO com Vulcan activo
disable-pong-cancelling: true

disable-default-resync-handler: false

# 1.21.1 nativo — duplicate packet fix da Mojang; evita conflitos
cancel-duplicate-packet: false
ignore-duplicate-packet-rotation: false

Simulation:
  setback-decay-multiplier: 0.999
  threshold: 0.001
  immediate-setback-threshold: 0.12
  max-advantage: 1.2
  max-ceiling: 4
  setback-violation-threshold: 2

Phase:
  setbackvl: 1
  decay: 0.005

AirLiquidPlace:
  cancelvl: 0

FabricatedPlace:
  cancelvl: 5

FarPlace:
  cancelvl: 5

PositionPlace:
  cancelvl: 5

RotationPlace:
  cancelvl: 5

NoSlow:
  threshold: 0.001
  setbackvl: 8
  decay: 0.05

Knockback:
  setback-decay-multiplier: 0.999
  threshold: 0.001
  immediate-setback-threshold: 0.12
  max-advantage: 1.0
  max-ceiling: 4

Explosion:
  threshold: 0.001
  setbackvl: 3

TimerA:
  setbackvl: 12
  drift: 100

TimerLimit:
  ping-abuse-limit-threshold: 1000

NegativeTimer:
  drift: 1200

VehicleTimer:
  setbackvl: 10

PacketOrderI:
  exempt-placing-while-digging: false

Reach:
  threshold: 0.0005
  block-impossible-hits: true
  enable-post-packet: false

exploit:
  allow-sprint-jumping-when-using-elytra: true
  allow-building-on-ghostblocks: true
  distance-to-check-if-ghostblocks: 2

debug-pipeline-on-join: false
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

packet-spam-threshold: 120
debug-packet-cancel: false

max-ping-out-of-flying: 1000
max-ping-firework-boost: 1000

config-flavor: V2
config-version: 10
